apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.github.tvbox.osc'
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 32
        versionName '1.2.0'
        resConfigs 'zh', 'en'
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            outputFileName = 'MBox_v' + variant.versionName + '_' + variant.buildType.name
            if (variant.buildType.name == buildTypes.release.getName()) {
                outputFileName += '_' + new Date().format("yyyyMMdd")
            }
            outputFileName += '.apk'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    signingConfigs {
        config {
            keyAlias 'TVBoxOSC'
            keyPassword 'TVBoxOSC'
            storeFile file('..\\TVBoxOSC.jks')
            storePassword 'TVBoxOSC'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
        }

        release {
            signingConfig signingConfigs.config
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {//引入dlna-cast时的文件冲突
        exclude 'META-INF/beans.xml'
    }
}

dependencies {
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])

    implementation 'com.google.android.material:material:1.12.0'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') {
        exclude group: 'xmlpull', module: 'xmlpull'
        // Android framework 自带 XmlPullParser,避免 R8 程序类/框架类冲突
        exclude group: 'xpp3', module: 'xpp3_min'
    }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'

    implementation project(":player")
    implementation project(":quickjs")
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'

    implementation 'com.lzy.net:okgo:3.0.4'

    implementation 'com.github.getActivity:XXPermissions:13.6'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'

    //标题栏
    implementation 'com.github.getActivity:TitleBar:10.5'
    //弹窗
    implementation 'com.github.li-xiaojun:XPopup:2.10.0'
    //工具类
    implementation 'com.blankj:utilcodex:1.31.0'
    //阴影/shape/选择器/圆角/...
    implementation 'com.github.lihangleo2:ShadowLayout:3.3.3'
    //glide图片加载
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    //tab标题栏(Material TabLayout + ViewPager2)
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    //TabLayout的非kt项目需要依赖这个包实现点击事件等
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    //展开收缩tv
    implementation 'com.github.MZCretin:ExpandableTextView:v1.6.1-x'
    //lottie动画
    implementation 'com.airbnb.android:lottie:5.2.0'
    //流式布局
    implementation 'com.hyman:flowlayout-lib:1.1.2'
    //崩溃(正式版库,替代内嵌2.4.0-SNAPSHOT)
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    //dlna投屏(内嵌模块, 原JitPack构建已失效)
    implementation project(':dlna-dmc')
    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.2.0"
}